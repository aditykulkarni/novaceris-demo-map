<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Novaceris</title>
<style>
@font-face { font-family: "Inter"; font-style: normal; font-weight: 100 900; font-display: swap; src: url("fonts/InterVariable.woff2") format("woff2"); }
:root {
  --bg: #F2F4F6; --surface: #FFFFFF; --ink: #0E1B26; --muted: #5C6975; --line: #DCE2E7;
  --band: #0F2133; --band-ink: #FFFFFF; --band-muted: #A9B8C6;
  --accent: #1E5DA6; --accent-band: #7DB3F0; --bad: #BE3F2E; --good: #2C7A4C; --logo-ink: #004778;
  --shadow: 0 1px 2px rgba(10,20,30,.06), 0 8px 24px rgba(10,20,30,.07);
  --f-sans: "Inter", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0B131A; --surface: #131E27; --ink: #E6ECF1; --muted: #93A3B0; --line: #26343F; --band: #0E1E2C; --accent: #6EA2E0; --accent-band: #8CC0F5; --bad: #E2705F; --good: #5CB37D; --logo-ink: #E6ECF1; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0B131A; --surface: #131E27; --ink: #E6ECF1; --muted: #93A3B0; --line: #26343F; --band: #0E1E2C; --accent: #6EA2E0; --accent-band: #8CC0F5; --bad: #E2705F; --good: #5CB37D; --logo-ink: #E6ECF1; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-sans); -webkit-font-smoothing: antialiased; }
.nav { background: var(--surface); border-bottom: 1px solid var(--line); }
.in { max-width: 1280px; margin: 0 auto; padding: 0 24px; }
.nav .in { display: flex; align-items: center; min-height: 68px; }
.lockup { display: flex; align-items: center; gap: 12px; color: var(--logo-ink); }
.nv-mark { width: 52px; height: 42px; display: block; }
.nv-word { width: 128px; height: 17px; display: block; }
.powered { font-size: 12px; color: var(--muted); margin-top: 3px; }
.powered b { color: var(--ink); font-weight: 600; }
.band { background: var(--band); color: var(--band-ink); }
.band .in { padding-top: 26px; padding-bottom: 26px; }
.band h1 { margin: 0; font-weight: 300; font-size: clamp(26px, 3.4vw, 40px); letter-spacing: -.01em; line-height: 1.15; }
.band h1 b { font-weight: 600; color: var(--accent-band); }
main { flex: 1; display: grid; place-items: center; padding: 32px 16px 48px; }
.card { width: min(440px, 100%); background: var(--surface); border-top: 3px solid var(--accent); box-shadow: var(--shadow); padding: 32px 32px 28px; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin: 0 0 10px; }
.card h2 { margin: 0 0 8px; font-weight: 300; font-size: 28px; line-height: 1.2; }
.card p { margin: 0 0 22px; color: var(--muted); }
.btn { display: block; width: 100%; padding: 12px 16px; border: 0; border-radius: 3px; background: var(--accent); color: #fff; font: 600 15px var(--f-sans); text-align: center; text-decoration: none; cursor: pointer; }
.btn:hover { filter: brightness(1.08); }
.btn:focus-visible { outline: 3px solid var(--accent-band); outline-offset: 2px; }
.msg { margin: 0 0 18px; padding: 10px 12px; border-left: 3px solid var(--bad); background: color-mix(in srgb, var(--bad) 10%, transparent); color: var(--ink); font-size: 13px; }
.msg.ok { border-color: var(--good); background: color-mix(in srgb, var(--good) 10%, transparent); }
.fine { margin-top: 18px; font-size: 12px; color: var(--muted); }
@media (max-width: 520px) { .in { padding: 0 16px; } .card { padding: 24px 20px; } .nv-word { width: 104px; } }
</style>
<script>
// Same Day/Night choice as the demo itself
try { const t = localStorage.getItem('novaceris-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>

<header class="nav"><div class="in">
  <div class="lockup">
    <svg class="nv-mark" viewBox="174 12 315 255" aria-hidden="true"><use href="#nv-logo"/></svg>
    <div>
      <svg class="nv-word" viewBox="12 304 594 79" role="img" aria-label="Novaceris"><use href="#nv-logo"/></svg>
      <div class="powered">Powered by <b>The 3DEXPERIENCE Platform</b></div>
    </div>
  </div>
</div></header>
<section class="band"><div class="in"><h1><b>Perfect Production</b> for Sanitaryware</h1></div></section>
<main>
  <div class="card">
    <p class="eyebrow">Novaceris demo</p>
    <h2>Sign in</h2>
    <p>Use your 3DEXPERIENCE ID to open the demo.</p>
    <div id="msg" class="msg" role="status" hidden></div>
    <a class="btn" id="go" href="/auth/login">Sign in with 3DEXPERIENCE ID</a>
    <div class="fine">You are sent to the sign-in page and back here.</div>
  </div>
</main>
<script>
const q = new URLSearchParams(location.search), msg = document.getElementById('msg');
const user = q.get('user') || '';
const text = {
  noticket: 'The sign-in page did not send a ticket back. Please try again.',
  invalid: 'The sign-in could not be confirmed. Please try again.',
  unreachable: 'The sign-in server could not be reached from the demo laptop, so nobody can get in right now.',
  notallowed: (user ? user + ' does' : 'This account does') + ' not have access to this demo. Ask the presenter to add you.',
}[q.get('error')];
if (text) { msg.textContent = text; msg.hidden = false; }
else if (q.has('signedout')) { msg.textContent = 'You are signed out.'; msg.className = 'msg ok'; msg.hidden = false; }
// Keep a step link (#step=5) across the sign-in round trip
try { if (/^#step=\d+$/.test(location.hash)) sessionStorage.setItem('nv-return', location.hash); } catch (e) {}
</script>
